# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "OXC for TSRX"
  slug: "oxc-for-tsrx"
  kind: existing_plan
  tranche: "Architecture correction and continuous execution: keep OXC unforked, replace the rejected Zig production direction with a Rust-native core built on an exact canonical OXC revision behind a narrow compatibility adapter, then complete successive TDD vertical slices through formatter, linter, Vite+, editor, packaging, and read-only Markless proof."
  status: active
  oracle:
    signal: "Clean-checkout correctness and performance matrices plus a temporary-copy Markless/editor walkthrough prove formatter-on-save, lint diagnostics and safe fixes at TSRX source locations, Vite/Vite+ integration, installable packaging, OXC-class native/end-to-end/incremental performance, and ordinary TSX regression safety without external repository writes."
    cadence: "Run the relevant correctness and benchmark subset after each Worker package and the complete matrices at every phase boundary and final audit."
    final_proof: "Fresh command receipts, retained benchmark results, and captured walkthrough evidence map every claimed surface to passing tests, frozen performance budgets, or observed behavior; final audit records full_outcome_complete: true."
  intake:
    original_request: "Implement OXC for TSRX: the full practical Vite+ toolchain, including oxlint and oxfmt behavior, with TDD and proven Markless formatting-on-save and TSX-like lint diagnostics."
    interpreted_outcome: "TSRX developers can install one maintained non-fork integration and use OXC/Vite+ build, lint, format, fix, and editor workflows on .tsrx files with trustworthy source fidelity and OXC-class performance while official OXC packages remain independently upgradable."
    input_shape: existing_plan
    audience: "TSRX framework authors and application developers, beginning with Markless"
    authority: requested
    proof_type: test
    completion_proof: "Clean-checkout correctness and performance acceptance plus a temporary-copy editor/Markless walkthrough demonstrates all required surfaces without external writes, and the final audit finds no unproven compatibility or performance claim."
    likely_misfire: "A toy transpile-and-lint wrapper passes unit tests but real formatting, fixes, source spans, editor activation, Vite+ orchestration, plugin composition, Markless syntax, memory behavior, or native/end-to-end speed do not work."
    blind_spots_considered:
      - "The requested workspace is empty and is not currently a Git worktree."
      - "Authoritative TSRX/OXC/Vite+ repositories, versions, APIs, and licenses must be resolved before architecture is fixed."
      - "Stock OXC binary support differs from OXC-compatible behavior delivered through project-owned CLIs/plugins."
      - "Diagnostics, safe fixes, formatter fidelity, idempotence, type-aware rules, and editor lifecycle have different mapping constraints."
      - "Native OXC speed can be erased by redundant parsing, per-node allocation, source copying, full-AST JSON/JS materialization, NAPI/IPC transfer, or slow incremental editor orchestration."
      - "Raw native, complete-output, CLI-boundary, memory, cold-start, and editor-incremental benchmarks need separate same-machine baselines and frozen numeric budgets."
      - "Vite plugin ordering, HMR, platform packaging, upstream AST churn, and external-repository permissions need explicit proof or policy."
      - "Stock Oxlint and Oxfmt do not currently expose complete custom-language parser/formatter hooks, so companion behavior and true stock-binary support must be named and tested separately."
      - "A package alias or process adapter can preserve update isolation but still needs capability probes, config/path fidelity, source-map safety, and minimum/current/canary version tests."
    existing_plan_facts:
      - "The project name is OXC for TSRX."
      - "TSRX is a whole-file TSX extension with interleaved syntax, not a container with an isolated standard script block."
      - "TSRX-to-TSX transformation is a possible integration boundary, but the final architecture must be validated against formatting, fixes, spans, and editor requirements."
      - "Desired surfaces include Vite/Vite+, Vite plugin composition, oxlint-compatible lint/config/plugin behavior, oxfmt-like formatting, type-aware lint where practical, and editor format-on-save/live diagnostics."
      - "Implementation is test-first and must make success clear with real behavior, not only design claims."
      - "/Users/jacksm5pro/dev/open-source/markless is a strictly read-only real-world acceptance target; format-on-save uses a copy in this repo or a disposable temporary workspace."
      - "All writes stay inside /Users/jacksm5pro/dev/open-source/oxc-tsrx unless the user later gives exact approval for a separately scoped external write."
      - "OXC for TSRX must preserve OXC's native performance advantages and make TSRX feel first-class across OXC-compatible tools."
      - "The Yuku high-performance parser article and reproducible benchmark repositories are performance-design references for flat/indexed representations, amortized allocation, lazy work, cache locality, transfer-friendly ASTs, and honest native-versus-npm measurements."
      - "OXC for TSRX must never vendor, fork, copy, or maintain a downstream source patch queue for OXC, Oxlint, Oxfmt, or Vite+."
      - "The current adapter must use one coherent OXC workspace graph from one exact canonical Git revision: mixing crates.io and Git instances would duplicate nominal allocator/AST/span/syntax types. A future crates.io-only graph is permitted only when the complete required engine closure resolves coherently from that one source; snapshots, forks, Cargo patches, patch queues, file-relative imports, and undocumented private/generated layouts remain forbidden."
      - "The production TSRX language core is Rust. JavaScript/TypeScript is a thin npm, Vite/Vite+, configuration, and editor shell and may not own the language AST or hot path."
      - "Yuku is a read-only performance/design oracle, not a production dependency or distributed component."
      - "An installed native artifact pins its OXC crate set; deliberate upstream upgrades are isolated to the compatibility adapter and must pass minimum/current/next behavior and performance lanes before release."
      - "Canonical OXC 8e0ed2ebb96137fb1611cdbd5742d5cb46037d40 marks config, linter, formatter, formatter-core, and language-server engines publish=false. Their public APIs exchange workspace sibling types, so all twelve direct adapter dependencies use the same exact canonical Git source and compile without a project-owned source snapshot, fork, or patch."
      - "Current Vite+ resolves project-local oxlint and oxfmt packages before its bundled copies, including the Fmt/Lint phases used by literal vp check; npm aliases plus expected package/bin shape are the non-fork command seam."
      - "The official OXC VS Code extension discovers project oxlint/oxfmt binaries but omits .tsrx selectors and activation, so a thin companion selector client remains required unless upstream makes selectors configurable."
      - "One contiguous native legal-TSX projection buffer is allowed only on the TSRX path and only while separately measured P02/P03/P04/P07 gates pass; ordinary JS/TS paths delegate directly without the scan or copy."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

