# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Upstream-grade TSRX parser API design"
  slug: "parser-upstream-design"
  kind: specific
  tranche: "Design tranche: evidence -> tenets/rubric -> draft -> adversarial critique -> revision -> final audit. No Rust implementation, no markless edits, no upstream contact."
  status: active
  oracle:
    signal: "Design doc on design/upstream-parser whose adversarial critique receipt maps every T003 rubric criterion (OXC convention alignment, oxc-tsrx philosophy, markless replacement bar, explicit CSS/loose-mode rulings) to concrete design sections with no unresolved rejection."
    cadence: "after T004 draft, at T005 critique, and at final audit"
    final_proof: "T005/T006 receipts showing critique findings resolved + T999 audit with full_outcome_complete: true"
  intake:
    original_request: "Look into the oxc-tsrx repo, then craft up the parser design that ensures it's something the oxc maintainers would want upstream, while also keeping close to the philosophy of the oxc-tsrx project. Board created inside oxc-tsrx, in a new git worktree."
    interpreted_outcome: "An adversarially-reviewed design document for a JS-callable TSRX parser API in oxc-tsrx, upstream-grade by OXC's own conventions, philosophy-preserving, and satisfying markless's @tsrx/core replacement bar."
    input_shape: specific
    audience: "owner; secondarily oxc-tsrx contributors, potential OXC reviewers, markless as consumer #1"
    authority: requested
    proof_type: artifact
    completion_proof: "Committed design doc surviving adversarial critique against the T003 rubric; T999 audit records full_outcome_complete: true."
    likely_misfire: "A markless-convenience spec ignoring OXC conventions; an upstream-pleasing design failing markless's replacement bar; drifting into Rust implementation."
    blind_spots_considered:
      - "Ambiguity of 'upstream': contribute pieces into oxc-project/oxc vs OXC-convention-aligned design living in oxc-tsrx; design must cover both readings explicitly."
      - "CSS raw-byte compliance decision and fail-closed grammar conflict with markless's parsed-CSS and loose-mode needs; require explicit argued rulings."
      - "UTF-8 byte spans vs markless UTF-16 offsets."
      - "8-target native binary distribution as a compiler dependency."
    existing_plan_facts:
      - "2026-07-17 verdict (markless repo, goals/oxc-tsrx-replacement/notes/verdict.md, gitignored-but-present, read with cat): no JS-callable parse API exists in oxc-tsrx today; grep-verified no napi/WASM/cdylib anywhere."
      - "Shortest credible path: napi-rs over tsrx_syntax + pinned OXC parse; @tsrx/core-compatible AST serializer reconstructing TSRX nodes from an expanded public overlay; UTF-16 offset translation; CSS tree for <style>; loose/collect mode; isEventAttribute/normalizeEventName; SyntaxError-shaped strict failures; type subpaths; 8-target packaging."
      - "markless consumption contract: 3 runtime symbols, ~60 AST discriminants, UTF-16 half-open start/end offsets, CSS-relative selector offsets, CompileError/loose editor mode; full detail in the markless-side scout receipt referenced by the verdict note."
      - "oxc-tsrx already gates releases on a markless control corpus pinned to @tsrx/core@0.1.32 (179 files) — formatting compatibility proven, parser equivalence not."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  # Claude Code session exposes goal-scout / goal-worker / goal-judge agent types.
  # Fable-session convention: execution is dispatched via crew run (gpt-5.6-sol); PM adjudicates.
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/parser-upstream-design/"
    command: "npx goalbuddy board docs/goals/parser-upstream-design"

