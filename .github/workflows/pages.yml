name: Deploy static documentation

on:
  workflow_dispatch:
    inputs:
      approval:
        description: Type DEPLOY WEBSITE 0.1.0 after exact owner approval
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: inputs.approval == 'DEPLOY WEBSITE 0.1.0'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the selected exact source revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Node.js 24.15.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install the locked documentation graph
        run: npm ci --ignore-scripts

      - name: Build and prove the static artifact
        run: |
          npm run docs:build
          npm run test:site:unit
          npm run test:site:static
          npm run docs:check

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload the exact static artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs/dist

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Deploy the reviewed Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
