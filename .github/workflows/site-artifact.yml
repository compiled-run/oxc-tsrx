name: Build website artifact

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-artifact-${{ github.ref }}
  # A superseded pull-request run is wasted wall clock. A superseded run on main
  # is a deploy that never happened, so those still queue.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests get the site tests and nothing else.
  #
  # The drift test that binds docs/reference/platform-support.md to
  # packages/toolchain/dist/native-targets.js lives in test:site:unit, and this
  # workflow was the only place that ran it. Triggering on push to main meant a
  # pull request could diverge the published support matrix from the target list
  # this project actually builds and only find out after it landed.
  #
  # This job exists rather than simply letting `build` run on pull requests
  # because `build` installs a Rust target and compiles the WebAssembly demo
  # engine. Even with cargo caching and WASM artifact caching, that is still
  # extra time per pull request to prove something no pull request is asking
  # about. Everything the site tests need is a plain `docs:build`: the site
  # falls back to the static demo when the WebAssembly artifact is absent
  # (docs/build.mjs:1743-1750), and both suites were confirmed green against a
  # build with no wasm artifact at all. The full artifact-and-deploy path stays
  # on push and dispatch, where the bytes it produces are actually used.
  #
  # The one thing a pull request does not get: the checks that need the real
  # engine. "generated WebAssembly executes the real lint, format, and
  # projection engines" self-skips without the artifact, and the static
  # verifier runs 113 checks here against 151 on `main`. Everything that binds
  # the docs to this repository's own source, including the platform-support
  # drift test, runs in both.
  #
  # Cost, measured on this branch: ~2 min here against ~3–7 min for the build
  # job (depending on WASM cache hit) plus ~30s to deploy.
  site-tests:
    name: Site tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the pull request revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install the pinned pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install Node.js 24.15.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install the locked documentation graph
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Prove the site still builds and its claims still hold
        run: |
          pnpm run docs:build
          pnpm run test:site:unit
          pnpm run test:site:static

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the selected exact source revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install the pinned pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install Node.js 24.15.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install the locked documentation graph
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Compute WASM inputs hash
        id: wasm-hash
        run: |
          set -euo pipefail
          # Hash all inputs that affect the WASM build: demo-wasm source,
          # its dependencies (tsrx_* crates), Cargo manifests and locks.
          wasm_hash=$(
            git ls-files -z \
              'docs/tools/demo-wasm/**' \
              'crates/tsrx_*/**' \
              'Cargo.toml' 'Cargo.lock' \
              'docs/tools/demo-wasm/Cargo.toml' \
              'docs/tools/demo-wasm/Cargo.lock' \
            | sort -z \
            | xargs -0 shasum -a 256 \
            | shasum -a 256 \
            | cut -d' ' -f1
          )
          echo "hash=${wasm_hash}" >> "${GITHUB_OUTPUT}"
          echo "WASM inputs hash: ${wasm_hash}"

      - name: Restore cached WASM artifact
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: docs/tools/demo-wasm/dist
          key: wasm-artifact-${{ runner.os }}-${{ steps.wasm-hash.outputs.hash }}

      - name: Install the threaded WASI Rust target
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: rustup target add wasm32-wasip1-threads

      - name: Set up Rust cache
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: docs/tools/demo-wasm

      - name: Build the WASM artifact from scratch
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: pnpm run docs:wasm

      - name: Build and prove the real browser-engine artifact
        run: |
          OXC_TSRX_REQUIRE_WASM=1 pnpm run docs:build
          pnpm run test:site:unit
          node tests/site/verify-static.mjs --require-wasm
          pnpm run docs:check

      - name: Fetch and embed Guessless docs
        run: |
          set -euo pipefail
          # Fetch the Guessless docs from compiled-run/guessless via tarball
          # (faster than full git clone) and copy them into docs/dist/guessless/
          # so they ship in the same Vercel deploy.
          echo "Fetching Guessless docs from compiled-run/guessless..."
          TEMP_DIR="$(mktemp -d)"
          curl -fsSL "https://github.com/compiled-run/guessless/archive/refs/heads/main.tar.gz" \
            | tar -xz -C "${TEMP_DIR}" --strip-components=1
          mkdir -p docs/dist/guessless
          cp -r "${TEMP_DIR}/site/guessless/." docs/dist/guessless/
          rm -rf "${TEMP_DIR}"
          echo "Guessless docs copied to docs/dist/guessless/"
          ls -la docs/dist/guessless/ | head -20

      - name: Upload the exact Vercel-shaped static artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oxc-tsrx-docs-${{ github.sha }}
          path: docs/dist
          if-no-files-found: error
          retention-days: 14

  # Deliberately a separate job. The build above runs the whole dependency
  # graph -- pnpm postinstalls, 205 crates of cargo, every docs script -- and
  # none of that is ever in the same runner as the deploy credential. This job
  # does not check the repository out at all: it only unpacks the artifact the
  # build already proved and hands it to Vercel.
  deploy:
    needs: build
    if: github.repository == 'compiled-run/oxc-tsrx' && github.ref_name == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    environment:
      name: production
      url: https://compiled.run/oxc-tsrx
    env:
      # The static docs project. Vercel's Git integration is deliberately not
      # connected: the site cannot be built on Vercel's image, so the artifact
      # the build job proved is the only thing that ever reaches production.
      VERCEL_ORG_ID: team_4TrBQsvIkFM0lYTqh08Fqxgd
      VERCEL_PROJECT_ID: prj_ErfsoKm2LTTCtEYIdlv7jw8cik1G
    steps:
      - name: Download the artifact the build job proved
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: oxc-tsrx-docs-${{ github.sha }}
          path: dist

      - name: Ship that artifact to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN}" ]; then
            echo "::error::VERCEL_TOKEN is not set on the production environment."
            exit 1
          fi
          url="$(npx --yes vercel@57.0.0 deploy \
            --cwd dist \
            --prod \
            --yes \
            --token "${VERCEL_TOKEN}")"
          echo "Deployed ${url}"

      - name: Prove production is serving this build
        run: |
          set -euo pipefail
          # The project's stable production alias: verification must not depend
          # on custom-domain DNS, which can change independently of a deploy.
          # The site lives under the /oxc-tsrx base path (docs/site.config.mjs).
          origin="https://oxc-tsrx-docs.vercel.app/oxc-tsrx"
          for attempt in 1 2 3 4 5; do
            if curl -fsS "${origin}/demo-capabilities.json" -o capabilities.json; then
              break
            fi
            echo "attempt ${attempt} could not read the live capabilities, retrying"
            sleep 5
          done
          node -e '
            const live = require("./capabilities.json")
            if (!live.ok || !live.wasm || live.mode !== "wasm") {
              throw new Error(`production is not serving the WebAssembly engine: ${JSON.stringify(live)}`)
            }
          '
          # demo-capabilities.json is byte-identical across builds, so matching
          # it would also "pass" against a deploy that never took effect. Hash
          # the actual page instead: that only matches if production is serving
          # the artifact this run built.
          # No trailing slash: the deploy redirects /oxc-tsrx/ to /oxc-tsrx
          # (trailingSlash: false) and curl is not following redirects.
          curl -fsS "${origin}" -o live-index.html
          live="$(shasum -a 256 < live-index.html | cut -d" " -f1)"
          built="$(shasum -a 256 < dist/oxc-tsrx/index.html | cut -d" " -f1)"
          if [ "${live}" != "${built}" ]; then
            echo "::error::production serves index.html ${live}, this run built ${built}"
            exit 1
          fi
          echo "production is serving this run's build (${built})"

      - name: Prove Guessless docs are accessible
        run: |
          set -euo pipefail
          # Verify that the Guessless docs (from https://github.com/compiled-run/guessless)
          # are accessible after this oxc-tsrx deploy. The docs are now embedded as
          # static files under /guessless/ in the artifact.
          origin="https://oxc-tsrx-docs.vercel.app/guessless"
          echo "Checking that ${origin} is accessible..."
          for attempt in 1 2 3 4 5; do
            status_code="$(curl -fsS -o /dev/null -w '%{http_code}' "${origin}" || echo "000")"
            if [ "${status_code}" = "200" ]; then
              echo "✓ Guessless docs are accessible (HTTP ${status_code})"
              break
            fi
            if [ "${status_code}" = "404" ]; then
              echo "::error::Guessless returned 404! The static docs were not embedded."
              exit 1
            fi
            echo "attempt ${attempt}: got HTTP ${status_code}, retrying..."
            sleep 5
          done
          if [ "${status_code}" != "200" ]; then
            echo "::error::Could not verify Guessless docs accessibility after 5 attempts"
            exit 1
          fi
          
          # Also verify via the custom domain (compiled.run)
          custom_origin="https://compiled.run/guessless"
          echo "Checking that ${custom_origin} is accessible..."
          for attempt in 1 2 3 4 5; do
            custom_status="$(curl -fsS -o /dev/null -w '%{http_code}' "${custom_origin}" || echo "000")"
            if [ "${custom_status}" = "200" ]; then
              echo "✓ Guessless docs accessible via custom domain (HTTP ${custom_status})"
              exit 0
            fi
            if [ "${custom_status}" = "404" ]; then
              echo "::error::Guessless at custom domain returned 404!"
              exit 1
            fi
            echo "attempt ${attempt}: custom domain got HTTP ${custom_status}, retrying..."
            sleep 5
          done
          echo "::error::Could not verify Guessless via custom domain after 5 attempts"
          exit 1
