[package]
name = "oxc_adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
oxc_allocator = { git = "https://github.com/oxc-project/oxc", rev = "8e0ed2ebb96137fb1611cdbd5742d5cb46037d40" }
oxc_ast = { git = "https://github.com/oxc-project/oxc", rev = "8e0ed2ebb96137fb1611cdbd5742d5cb46037d40" }
oxc_ast_visit = { git = "https://github.com/oxc-project/oxc", rev = "8e0ed2ebb96137fb1611cdbd5742d5cb46037d40" }
oxc_config = { git = "https://github.com/oxc-project/oxc", rev = "8e0ed2ebb96137fb1611cdbd5742d5cb46037d40" }
oxc_formatter = { git = "https://github.com/oxc-project/oxc", rev = "8e0ed2ebb96137fb1611cdbd5742d5cb46037d40" }
oxc_formatter_core = { git = "https://github.com/oxc-project/oxc", rev = "8e0ed2ebb96137fb1611cdbd5742d5cb46037d40" }
oxc_linter = { git = "https://github.com/oxc-project/oxc", rev = "8e0ed2ebb96137fb1611cdbd5742d5cb46037d40" }
oxc_language_server = { git = "https://github.com/oxc-project/oxc", rev = "8e0ed2ebb96137fb1611cdbd5742d5cb46037d40" }
oxc_parser = { git = "https://github.com/oxc-project/oxc", rev = "8e0ed2ebb96137fb1611cdbd5742d5cb46037d40" }
oxc_semantic = { git = "https://github.com/oxc-project/oxc", rev = "8e0ed2ebb96137fb1611cdbd5742d5cb46037d40", features = ["cfg", "linter"] }
oxc_span = { git = "https://github.com/oxc-project/oxc", rev = "8e0ed2ebb96137fb1611cdbd5742d5cb46037d40" }
oxc_syntax = { git = "https://github.com/oxc-project/oxc", rev = "8e0ed2ebb96137fb1611cdbd5742d5cb46037d40" }
rustc-hash = "2.1.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["rt-multi-thread"] }
tower-lsp-server = "0.23.0"

[lints]
workspace = true
